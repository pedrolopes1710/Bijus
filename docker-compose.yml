services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - bijus

  api:
    build:
      context: ./dddnetcore
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      APPLY_MIGRATIONS: "true"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=${MSSQL_DATABASE};User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True"
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: BijusAPI
      JwtSettings__Audience: BijusUsers
      ALLOWED_ORIGINS: ${PUBLIC_SITE_URL}
      PublicSiteUrl: ${PUBLIC_SITE_URL}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      ADMIN_USERS: ${ADMIN_USERS}
      SUPER_ADMIN_USERS: ${SUPER_ADMIN_USERS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Biscuit&Arte}
    volumes:
      - api_uploads:/app/wwwroot/uploads
    networks:
      - bijus

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_SITE_URL}/api
        NEXT_PUBLIC_AUTH0_DOMAIN: ${NEXT_PUBLIC_AUTH0_DOMAIN}
        NEXT_PUBLIC_AUTH0_CLIENT_ID: ${NEXT_PUBLIC_AUTH0_CLIENT_ID}
        NEXT_PUBLIC_AUTH0_REDIRECT_URI: ${PUBLIC_SITE_URL}/auth/callback
        NEXT_PUBLIC_AUTH0_AUDIENCE: ${NEXT_PUBLIC_AUTH0_AUDIENCE}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - bijus

  # [APENAS DEV] Encaminha os eventos da Stripe para a API (confirmação automática em testes locais).
  # Corre só com o profile "dev" (o .env local tem COMPOSE_PROFILES=dev).
  # Em produção NÃO corre — usa-se um webhook real no Dashboard da Stripe.
  stripe:
    image: stripe/stripe-cli:latest
    restart: unless-stopped
    profiles: ["dev"]
    depends_on:
      - api
    command: listen --api-key ${STRIPE_SECRET_KEY} --forward-to http://api:8080/api/pagamentos/stripe/webhook
    networks:
      - bijus

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - api
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "8090:80"
      - "8453:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - bijus

volumes:
  sqlserver_data:
    name: bijus_sqlserver_data
  api_uploads:
    name: bijus_api_uploads
  caddy_data:
    name: bijus_caddy_data
  caddy_config:
    name: bijus_caddy_config

networks:
  bijus:
    driver: bridge
